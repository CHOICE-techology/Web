<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Identity Studio V4.1a prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Nunito:wght@400;600&display=swap">
<style>
:root{--ink:#111;--grey:#545454;--rule:#E7E9EB;--cy:#34FAFB}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#F7F8F9;overflow:hidden;color:var(--ink);font:16px/1.55 Nunito,system-ui,sans-serif}
canvas{display:block;width:100%;height:100%;touch-action:none}
#loading{position:fixed;inset:0;display:grid;place-items:center;color:var(--grey);font-size:14px}
.btn{font:600 15px Poppins,system-ui,sans-serif;padding:12px 20px;border-radius:8px;border:1px solid #000;background:#fff;color:#111;cursor:pointer;min-height:44px;
  box-shadow:inset 0 1px 0 #fff,0 1px 2px rgba(0,0,0,.08),0 6px 16px rgba(0,0,0,.06)}
.btn:hover{border-color:#000;box-shadow:inset 0 1px 0 #fff,0 0 0 3px rgba(52,250,251,.35),0 6px 16px rgba(0,0,0,.06)}
.btn:focus-visible,#folderBtn:focus-visible{outline:2px solid #000;outline-offset:3px}
.ctl{position:fixed;right:16px;bottom:16px;display:flex;gap:8px}
#folderBtn{position:fixed;left:0;top:0;width:80px;height:80px;border-radius:12px;border:0;background:transparent;cursor:pointer;opacity:0}
#folderBtn:focus-visible{opacity:1;background:rgba(255,255,255,.2)}
body:not(.live) #folderBtn{pointer-events:none}
#panel{position:fixed;right:clamp(16px,6vw,96px);top:50%;transform:translate(16px,-50%);opacity:0;transition:opacity .25s,transform .25s;
  width:min(420px,calc(100vw - 32px));background:rgba(255,255,255,.92);border:1px solid var(--rule);border-radius:8px;padding:28px 28px 24px;
  box-shadow:0 20px 60px rgba(0,0,0,.08);backdrop-filter:blur(6px)}
#panel.in{opacity:1;transform:translate(0,-50%)}
#panel .eyebrow{font:600 13px Poppins,system-ui,sans-serif;color:var(--grey);margin:0 0 14px;display:flex;align-items:center;gap:10px}
#panel .eyebrow::before{content:"";width:28px;height:1px;background:var(--cy)}
#panel h2{font:700 28px/1.1 Poppins,system-ui,sans-serif;margin:0 0 6px}
#panel h3{font:600 20px/1.25 Poppins,system-ui,sans-serif;margin:0 0 10px}
#panel p{margin:0 0 20px;color:#222}
@media(max-width:760px){#panel{right:16px;left:16px;top:auto;bottom:84px;transform:translateY(16px);width:auto}#panel.in{transform:none}}
#stats{position:fixed;left:16px;top:16px;font:12px/1.4 Nunito,system-ui,sans-serif;color:var(--grey);background:rgba(255,255,255,.85);border:1px solid var(--rule);border-radius:8px;padding:6px 10px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
body.clean #stats,body.clean .ctl,body.clean #bench{display:none}
#bench{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:#fff;border:1px solid var(--rule);border-radius:8px;padding:20px 24px;font:15px/1.6 Nunito,system-ui,sans-serif;box-shadow:0 20px 60px rgba(0,0,0,.08);max-width:calc(100vw - 32px)}
#bench b{font:700 28px Poppins,system-ui,sans-serif}
@media(prefers-reduced-motion:reduce){#panel{transition:none}}
</style></head>
<body>
<canvas id="c" role="img" aria-label="CHOICE iD Identity Studio: a glass case holding a human profile, wrapped by a twisted glass ribbon, with five glass evidence tiles around it: a graduation cap, a briefcase, a certificate, a folder and a globe."></canvas>
<div id="loading">Loading the Identity Studio</div>
<div id="stats"><span id="fps">measuring</span></div>
<button id="folderBtn" hidden aria-haspopup="dialog" aria-controls="panel">
  <span class="sr">Open the folder: How it works, Add</span></button>
<div id="panel" role="dialog" aria-modal="false" aria-labelledby="pTitle" hidden>
  <p class="eyebrow">01&nbsp;&nbsp;&nbsp;HOW IT WORKS</p>
  <h2 id="pTitle">ADD</h2>
  <h3>Add what you already have.</h3>
  <p>Your work accounts, diplomas, courses and certificates. Each one is checked with the place that gave it to you.</p>
  <button class="btn" id="close">Back to the studio</button>
</div>
<div id="bench" hidden></div>
<div class="ctl"><button class="btn" id="skip">Skip intro</button><button class="btn" id="replay" hidden>Replay intro</button></div>
<script src="studio.glb.js?v=16"></script>
<script type="module" src="bundle.js?v=16"></script>
</body></html>
